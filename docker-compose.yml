version: '3.8'

services:
  easyimage:
    build: .
    container_name: easyimage
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 配置文件目录
      - ./config:/app/config
      # 图片存储目录
      - ./i:/app/i
      # 日志目录
      - ./admin/logs:/app/admin/logs
    environment:
      - TZ=Asia/Shanghai
    networks:
      - easyimage

networks:
  easyimage:
    driver: bridge
