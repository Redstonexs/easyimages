<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - {{.config.Title}}</title>
    <link rel="stylesheet" href="/public/static/zui/css/zui.min.css">
    <link rel="stylesheet" href="/public/static/EasyImage.css">
</head>
<body>
    <nav class="navbar navbar-default">
        <div class="container">
            <div class="navbar-header">
                <a class="navbar-brand" href="/admin/manager">EasyImage 管理后台</a>
            </div>
            <ul class="nav navbar-nav navbar-right">
                <li><a href="/">首页</a></li>
                <li><a href="/admin/history">历史上传</a></li>
                <li><a href="/admin/urllist">图片列表</a></li>
                <li><a href="/admin/chart">统计</a></li>
                <li><a href="/admin/filer">文件管理</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-3">
                <div class="panel panel-primary">
                    <div class="panel-heading">
                        <h3 class="panel-title">系统信息</h3>
                    </div>
                    <div class="panel-body">
                        <p>版本: v{{.version}}</p>
                        <p>文件数: {{.totalFiles}}</p>
                        <p>已用空间: {{format_size .usedSpace}}</p>
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <h3 class="panel-title">基本配置</h3>
                    </div>
                    <div class="panel-body">
                        <form id="configForm">
                            <div class="form-group">
                                <label>站点标题</label>
                                <input type="text" name="title" class="form-control" value="{{.config.Title}}">
                            </div>
                            <div class="form-group">
                                <label>域名</label>
                                <input type="text" name="domain" class="form-control" value="{{.config.Domain}}">
                            </div>
                            <div class="form-group">
                                <label>图片域名</label>
                                <input type="text" name="imgurl" class="form-control" value="{{.config.ImageURL}}">
                            </div>
                            <div class="form-group">
                                <label>存储路径</label>
                                <input type="text" name="path" class="form-control" value="{{.config.Path}}">
                            </div>
                            <div class="form-group">
                                <label>最大上传大小 (字节)</label>
                                <input type="number" name="maxSize" class="form-control" value="{{.config.MaxSize}}">
                            </div>
                            <div class="form-group">
                                <label>允许的扩展名</label>
                                <input type="text" name="extensions" class="form-control" value="{{.config.Extensions}}">
                            </div>
                            <div class="form-group">
                                <label>登录上传</label>
                                <select name="mustLogin" class="form-control">
                                    <option value="0" {{if eq .config.MustLogin 0}}selected{{end}}>关闭（所有人可上传）</option>
                                    <option value="1" {{if eq .config.MustLogin 1}}selected{{end}}>开启（仅登录用户可上传）</option>
                                </select>
                                <p class="help-block">开启后必须登录才能上传图片，API上传不受此限制</p>
                            </div>
                            <div class="form-group">
                                <label>图片质量</label>
                                <input type="number" name="compress_ratio" class="form-control" value="{{.config.CompressRatio}}" min="1" max="100">
                            </div>
                            <div class="form-group">
                                <label>缩略图模式</label>
                                <select name="thumbnail" class="form-control">
                                    <option value="0" {{if eq .config.Thumbnail 0}}selected{{end}}>不生成</option>
                                    <option value="1" {{if eq .config.Thumbnail 1}}selected{{end}}>访问时生成</option>
                                    <option value="2" {{if eq .config.Thumbnail 2}}selected{{end}}>上传时生成</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>缩略图宽度</label>
                                <input type="number" name="thumbnail_w" class="form-control" value="{{.config.ThumbnailW}}">
                            </div>
                            <div class="form-group">
                                <label>缩略图高度</label>
                                <input type="number" name="thumbnail_h" class="form-control" value="{{.config.ThumbnailH}}">
                            </div>
                            <hr>
                            <h4><i class="icon icon-file-image"></i> WebP转换设置</h4>
                            <div class="form-group">
                                <label>自动转换WebP</label>
                                <select name="webp_convert" class="form-control">
                                    <option value="0" {{if eq .config.WebpConvert 0}}selected{{end}}>关闭</option>
                                    <option value="1" {{if eq .config.WebpConvert 1}}selected{{end}}>开启</option>
                                </select>
                                <p class="help-block">开启后上传图片会自动生成WebP版本，存储在独立文件夹中</p>
                            </div>
                            <div class="form-group">
                                <label>WebP质量 (1-100)</label>
                                <input type="number" name="webp_quality" class="form-control" value="{{.config.WebpQuality}}" min="1" max="100">
                            </div>
                            <div class="form-group">
                                <button type="button" id="batchWebpBtn" class="btn btn-success">
                                <i class="icon icon-refresh"></i> 批量生成WebP
                                </button>
                                <span id="batchWebpResult" class="help-block" style="margin-left:10px;"></span>
                                <p class="help-block">为已有图片批量生成WebP版本，已有WebP的图片会自动跳过</p>
                            </div>
                            <hr>
                            <div class="form-group">
                                <label>水印类型</label>
                                <select name="watermark" class="form-control">
                                    <option value="0" {{if eq .config.Watermark 0}}selected{{end}}>无水印</option>
                                    <option value="1" {{if eq .config.Watermark 1}}selected{{end}}>文字水印</option>
                                    <option value="2" {{if eq .config.Watermark 2}}selected{{end}}>图片水印</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>水印文字</label>
                                <input type="text" name="waterText" class="form-control" value="{{.config.WaterText}}">
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="icon icon-save"></i> 保存配置
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/public/static/zui/lib/jquery/jquery-3.6.4.min.js"></script>
    <script src="/public/static/zui/js/zui.min.js"></script>
    <script>
        $('#configForm').on('submit', function(e) {
            e.preventDefault();
            $.post('/admin/manager', $(this).serialize() + '&action=save_config', function(data) {
                if (data.result === 'success') {
                    new $.zui.Messager('保存成功', {
                        type: 'success',
                        icon: 'ok-sign'
                    }).show();
                } else {
                    new $.zui.Messager(data.msg || '保存失败', {
                        type: 'danger',
                        icon: 'exclamation-sign'
                    }).show();
                }
            });
        });

        $('#batchWebpBtn').on('click', function() {
            var btn = $(this);
            btn.prop('disabled', true).html('<i class="icon icon-spin icon-spinner"></i> 转换中...');
            $('#batchWebpResult').text('');
            $.post('/admin/batch-webp', function(data) {
                btn.prop('disabled', false).html('<i class="icon icon-refresh"></i> 批量生成WebP');
                if (data.result === 'success') {
                    new $.zui.Messager(data.message, {
                        type: 'success',
                        icon: 'ok-sign'
                    }).show();
                    $('#batchWebpResult').text(data.message);
                } else {
                    new $.zui.Messager(data.message || '转换失败', {
                        type: 'danger',
                        icon: 'exclamation-sign'
                    }).show();
                    $('#batchWebpResult').text(data.message || '转换失败');
                }
            }).fail(function() {
                btn.prop('disabled', false).html('<i class="icon icon-refresh"></i> 批量生成WebP');
                new $.zui.Messager('请求失败', {
                    type: 'danger',
                    icon: 'exclamation-sign'
                }).show();
            });
        });
    </script>
</body>
</html>
