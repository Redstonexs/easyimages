<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提示 - {{.config.Title}}</title>
    <link rel="icon" href="{{.config.SiteIcon}}">
    <meta name="color-scheme" content="light dark">
    <script>(function(){try{var t=localStorage.getItem('easyimage-theme');var d=t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches);var r=document.documentElement;if(d){r.classList.add('dark');r.style.colorScheme='dark'}else{r.style.colorScheme='light'}}catch(e){}})();</script>
    <style>
        :root { --bg:#ffffff; --fg:#0a0a0a; --muted-fg:#666664; --border:#e6e6e4; }
        html { background: var(--bg); color: var(--fg); color-scheme: light; }
        html.dark { --bg:#0a0a0a; --fg:#f7f7f5; --muted-fg:#9a9a98; --border:rgba(255,255,255,0.11); color-scheme: dark; }
        * { box-sizing: border-box; }
        @keyframes ei-enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            background: var(--bg);
            color: var(--fg);
            font-family: "Inter", "Noto Sans SC", "PingFang SC", system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            width: 100%;
            max-width: 440px;
            padding: 32px 28px;
            border: 1px solid var(--border);
            border-radius: 14px;
            text-align: center;
            animation: ei-enter 240ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted-fg);
            margin-bottom: 14px;
        }
        h1 { margin: 0; font-size: 20px; font-weight: 600; }
        p { margin: 10px 0 24px; font-size: 13px; color: var(--muted-fg); }
        .actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .btn {
            display: inline-flex;
            align-items: center;
            height: 36px;
            padding: 0 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--fg);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
        }
        .btn-primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
        .btn:hover { opacity: 0.88; }
    </style>
</head>
<body>
    <main class="card">
        <span class="badge">Notice</span>
        <h1>{{.message}}</h1>
        <p>请检查访问链接是否正确，或返回首页继续操作。</p>
        <div class="actions">
            <a href="/" class="btn btn-primary">返回首页</a>
        </div>
    </main>
</body>
</html>
