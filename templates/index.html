<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.config.Title}}</title>
    <meta name="keywords" content="{{.config.Keywords}}">
    <meta name="description" content="{{.config.Description}}">
    <link rel="stylesheet" href="/public/static/zui/css/zui.min.css">
    <link rel="stylesheet" href="/public/static/EasyImage.css">
    <style>
        body { background: #f5f5f5; }
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fff;
        }
        .upload-area:hover { border-color: #3280fc; background: #f0f7ff; }
        .upload-area.dragover { border-color: #3280fc; background: #e6f0ff; }
        .upload-area.uploading { border-color: #f39c12; background: #fefcf3; cursor: default; }
        .upload-btn { margin: 20px 0; }
        .result-area { margin-top: 20px; }
        .link-box { margin: 10px 0; padding: 10px; background: #f9f9f9; border-radius: 5px; }
        .preview-img { max-width: 200px; max-height: 200px; margin: 10px; }
        .fab-buttons { position: fixed; bottom: 20px; right: 20px; z-index: 100; }

        /* 进度条样式 */
        .upload-progress-container {
            margin-top: 20px;
            display: none;
        }
        .upload-progress-container.active { display: block; }
        .file-progress-item {
            margin-bottom: 8px;
            padding: 10px 14px;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
        }
        .file-progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .file-progress-name {
            font-weight: 500;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 55%;
        }
        .file-progress-info {
            color: #999;
            font-size: 12px;
        }
        .progress { margin-bottom: 0; height: 6px; border-radius: 3px; overflow: hidden; background: #f0f0f0; }
        .progress-bar { transition: width 0.15s ease; border-radius: 3px; }
        .progress-bar-success { background: #06b96f; }
        .progress-bar-danger { background: #e74c3c; }
        .progress-bar-info { background: #3280fc; }
        .overall-progress {
            margin-top: 12px;
            padding: 12px 14px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        .overall-progress .progress { height: 10px; border-radius: 5px; }
        .overall-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
            color: #666;
        }
        .overall-stats .percentage {
            font-size: 18px;
            font-weight: 600;
            color: #3280fc;
        }
        .upload-status-icon {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            flex-shrink: 0;
        }
        .status-waiting { background: #ccc; }
        .status-uploading { background: #f39c12; animation: pulse 1s infinite; }
        .status-success { background: #06b96f; }
        .status-error { background: #e74c3c; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 800px; margin-top: 50px;">
        <div class="text-center">
            <h1>{{.config.Title}}</h1>
            <p class="text-muted">{{.config.Description}}</p>
        </div>

        <div class="upload-area" id="uploadArea">
            <i class="icon icon-cloud-upload icon-3x"></i>
            <h3>拖拽文件到此处或点击选择</h3>
            <p class="text-muted">支持 jpg, png, gif, webp 等格式，单文件最大 <span id="maxSizeDisplay"></span></p>
            <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
            <button class="btn btn-primary btn-lg upload-btn" id="selectBtn" onclick="document.getElementById('fileInput').click()">
                <i class="icon icon-upload"></i> 选择文件
            </button>
        </div>

        <!-- 上传进度区域 -->
        <div class="upload-progress-container" id="progressContainer">
            <div id="fileProgressList"></div>
            <div class="overall-progress" id="overallProgress">
                <div class="overall-stats">
                    <span id="overallInfo">准备上传...</span>
                    <span class="percentage" id="overallPercent">0%</span>
                </div>
                <div class="progress">
                    <div class="progress-bar progress-bar-info" id="overallBar" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="result-area" id="resultArea" style="display: none;">
            <h3>上传结果</h3>
            <div id="resultList"></div>
        </div>

        <div class="text-center" style="margin-top: 30px;">
            {{if .isAdmin}}
            <a href="/admin/history" class="btn btn-default"><i class="icon icon-time"></i> 历史上传</a>
            <a href="/admin/manager" class="btn btn-default"><i class="icon icon-cog"></i> 管理后台</a>
            {{end}}
            {{if .config.APIStatus}}
            <a href="/api/" class="btn btn-default"><i class="icon icon-code"></i> API接口</a>
            {{end}}
        </div>

        <div class="text-center text-muted" style="margin-top: 50px;">
            <p>Powered by <a href="https://github.com/icret/EasyImages2.0">EasyImage</a> v{{.version}}</p>
        </div>
    </div>

    <!-- 登录模态框 -->
    <div class="modal fade" id="loginModal">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">关闭</span></button>
                    <h4 class="modal-title"><i class="icon icon-sign-in"></i> 管理员登录</h4>
                </div>
                <div class="modal-body">
                    <div id="loginError" class="alert alert-danger" style="display: none;"></div>
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="loginUser" class="form-control" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="loginPass" class="form-control" placeholder="请输入密码" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="loginBtn"><i class="icon icon-ok"></i> 登录</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 悬浮按钮 -->
    <div class="fab-buttons">
        <div class="btn-group-vertical">
            <a href="/app/list" class="btn btn-default" title="图床广场"><i class="icon icon-list"></i></a>
            <button class="btn btn-primary" id="adminBtn" title="管理员登录"><i class="icon icon-user"></i></button>
        </div>
    </div>

    <script src="/public/static/zui/lib/jquery/jquery-3.6.4.min.js"></script>
    <script src="/public/static/zui/js/zui.min.js"></script>
    <script src="/public/static/zui/lib/clipboard/clipboard.min.js"></script>
    <script>
        const MAX_SIZE = {{.config.MaxSize}};

        function formatSize(bytes) {
            if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(1) + ' GB';
            if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
            if (bytes >= 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return bytes + ' B';
        }
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        document.getElementById('maxSizeDisplay').textContent = formatSize(MAX_SIZE);

        // ========== 登录 ==========
        $(document).ready(function() {
            $('#adminBtn').click(function() {
                {{if .isAdmin}}
                    window.location.href = '/admin/manager';
                {{else}}
                    $('#loginModal').modal('show');
                {{end}}
            });
            $('#loginBtn').click(function() {
                var user = $('#loginUser').val(), pass = $('#loginPass').val();
                if (!user || !pass) { $('#loginError').text('请输入用户名和密码').show(); return; }
                $.ajax({
                    url: '/api/login', type: 'POST',
                    data: { user: user, password: pass },
                    success: function(d) {
                        if (d.result === 'success') window.location.href = '/admin/manager';
                        else $('#loginError').text(d.message || '登录失败').show();
                    },
                    error: function(xhr) {
                        var msg = '登录请求失败';
                        try { msg = JSON.parse(xhr.responseText).message || msg; } catch(e) {}
                        $('#loginError').text(msg).show();
                    }
                });
            });
            $('#loginPass').keypress(function(e) { if (e.which === 13) $('#loginBtn').click(); });
        });

        // ========== 上传功能 ==========
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const resultArea = document.getElementById('resultArea');
        const resultList = document.getElementById('resultList');
        const progressContainer = document.getElementById('progressContainer');
        const fileProgressList = document.getElementById('fileProgressList');
        const overallBar = document.getElementById('overallBar');
        const overallPercent = document.getElementById('overallPercent');
        const overallInfo = document.getElementById('overallInfo');
        const selectBtn = document.getElementById('selectBtn');

        let isUploading = false;

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (!isUploading) uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (!isUploading) handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => {
            if (!isUploading) handleFiles(e.target.files);
        });

        // ========== 逐文件上传（核心：避免单个请求过大导致网关超时） ==========
        async function handleFiles(fileList) {
            if (fileList.length === 0 || isUploading) return;

            // 客户端文件大小预检
            const files = [];
            for (let i = 0; i < fileList.length; i++) {
                if (fileList[i].size > MAX_SIZE) {
                    new $.zui.Messager(`文件 "${fileList[i].name}" 超过大小限制 (${formatSize(MAX_SIZE)})`, {
                        type: 'warning', icon: 'exclamation-sign'
                    }).show();
                } else {
                    files.push(fileList[i]);
                }
            }
            if (files.length === 0) return;

            isUploading = true;
            uploadArea.classList.add('uploading');
            selectBtn.disabled = true;

            // 初始化进度 UI
            fileProgressList.innerHTML = '';
            progressContainer.classList.add('active');
            overallBar.style.width = '0%';
            overallBar.className = 'progress-bar progress-bar-info';
            overallPercent.textContent = '0%';
            overallInfo.textContent = `准备上传 ${files.length} 个文件...`;

            const totalSize = files.reduce((s, f) => s + f.size, 0);
            const fileProgress = []; // 每个文件已上传的字节数

            // 创建每个文件的进度条
            files.forEach((f, idx) => {
                fileProgress.push(0);
                const item = document.createElement('div');
                item.className = 'file-progress-item';
                item.id = 'fp-' + idx;
                item.innerHTML = `
                    <div class="file-progress-header">
                        <span class="file-progress-name" title="${escapeHtml(f.name)}">
                            <span class="upload-status-icon status-waiting" id="icon-${idx}"></span>
                            ${escapeHtml(f.name)}
                        </span>
                        <span class="file-progress-info">
                            <span id="fpinfo-${idx}">${formatSize(f.size)}</span>
                        </span>
                    </div>
                    <div class="progress">
                        <div class="progress-bar progress-bar-info" id="fpbar-${idx}" style="width: 0%"></div>
                    </div>
                `;
                fileProgressList.appendChild(item);
            });

            let successCount = 0;
            let failCount = 0;

            // 逐个文件上传
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const icon = document.getElementById('icon-' + i);
                const bar = document.getElementById('fpbar-' + i);
                const info = document.getElementById('fpinfo-' + i);

                // 标记当前文件为上传中
                icon.className = 'upload-status-icon status-uploading';

                try {
                    const result = await uploadSingleFile(file, i, fileProgress, totalSize);
                    // 成功
                    icon.className = 'upload-status-icon status-success';
                    bar.style.width = '100%';
                    bar.className = 'progress-bar progress-bar-success';
                    info.textContent = '✓ ' + formatSize(file.size);
                    successCount++;

                    if (result && result.url) {
                        resultArea.style.display = 'block';
                        addResult(result);
                    }
                } catch (err) {
                    // 失败
                    icon.className = 'upload-status-icon status-error';
                    bar.className = 'progress-bar progress-bar-danger';
                    bar.style.width = '100%';
                    info.textContent = '✗ ' + (err.message || '上传失败');
                    failCount++;
                }

                // 更新总进度
                updateOverallProgress(i + 1, files.length, successCount, failCount);
            }

            // 上传完成
            isUploading = false;
            uploadArea.classList.remove('uploading');
            selectBtn.disabled = false;
            fileInput.value = '';

            overallBar.style.width = '100%';
            if (failCount === 0) {
                overallBar.className = 'progress-bar progress-bar-success';
                overallInfo.textContent = `全部完成：${successCount} 个文件上传成功`;
                new $.zui.Messager('上传成功', { type: 'success', icon: 'ok-sign' }).show();
            } else if (successCount === 0) {
                overallBar.className = 'progress-bar progress-bar-danger';
                overallInfo.textContent = `上传失败：${failCount} 个文件`;
                new $.zui.Messager('上传失败', { type: 'danger', icon: 'exclamation-sign' }).show();
            } else {
                overallBar.className = 'progress-bar progress-bar-success';
                overallInfo.textContent = `上传完成：${successCount} 成功, ${failCount} 失败`;
                new $.zui.Messager(`${successCount} 个成功, ${failCount} 个失败`, { type: 'warning', icon: 'info-sign' }).show();
            }
        }

        // 上传单个文件，返回 Promise
        function uploadSingleFile(file, index, fileProgress, totalSize) {
            return new Promise((resolve, reject) => {
                const formData = new FormData();
                formData.append('file', file);

                const xhr = new XMLHttpRequest();

                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        // 更新此文件的进度条
                        const pct = Math.round((e.loaded / e.total) * 100);
                        const bar = document.getElementById('fpbar-' + index);
                        const info = document.getElementById('fpinfo-' + index);
                        if (bar) bar.style.width = pct + '%';
                        if (info) info.textContent = `${formatSize(e.loaded)} / ${formatSize(e.total)}`;

                        // 更新总进度
                        fileProgress[index] = e.loaded;
                        const totalLoaded = fileProgress.reduce((s, v) => s + v, 0);
                        const overallPct = totalSize > 0 ? Math.round((totalLoaded / totalSize) * 100) : 0;
                        overallBar.style.width = overallPct + '%';
                        overallPercent.textContent = overallPct + '%';
                        overallInfo.textContent = `正在上传 (${index + 1}/${fileProgress.length}): ${formatSize(totalLoaded)} / ${formatSize(totalSize)}`;
                    }
                });

                xhr.addEventListener('load', () => {
                    fileProgress[index] = file.size; // 确保标记为完成
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try {
                            const data = JSON.parse(xhr.responseText);
                            if (data.result === 'success' || data.code === 200 || data.url) {
                                resolve(data);
                            } else {
                                reject(new Error(data.message || '服务器拒绝'));
                            }
                        } catch (e) {
                            reject(new Error('响应解析错误'));
                        }
                    } else {
                        let msg = 'HTTP ' + xhr.status;
                        try { msg = JSON.parse(xhr.responseText).message || msg; } catch(e) {}
                        reject(new Error(msg));
                    }
                });

                xhr.addEventListener('error', () => reject(new Error('网络错误')));
                xhr.addEventListener('abort', () => reject(new Error('已取消')));

                // 设置超时 4 分钟（比 Cloudflare 的 100 秒长，让 CF 先超时能被捕获）
                xhr.timeout = 240000;
                xhr.addEventListener('timeout', () => reject(new Error('上传超时')));

                xhr.open('POST', '/app/upload');
                xhr.send(formData);
            });
        }

        function updateOverallProgress(completed, total, success, fail) {
            overallPercent.textContent = Math.round((completed / total) * 100) + '%';
        }

        function addResult(data) {
            const div = document.createElement('div');
            div.className = 'link-box';
            div.innerHTML = `
                <div class="row">
                    <div class="col-md-3">
                        <img src="${data.thumb || data.url}" class="preview-img" alt="preview">
                    </div>
                    <div class="col-md-9">
                        <div class="input-group">
                            <span class="input-group-addon">直链</span>
                            <input type="text" class="form-control url-input" value="${escapeHtml(data.url)}" readonly>
                            <span class="input-group-btn">
                                <button class="btn btn-primary copy-btn" data-clipboard-text="${escapeHtml(data.url)}">复制</button>
                            </span>
                        </div>
                        <div class="input-group" style="margin-top: 5px;">
                            <span class="input-group-addon">Markdown</span>
                            <input type="text" class="form-control url-input" value="![${escapeHtml(data.srcName || '')}](${escapeHtml(data.url)})" readonly>
                            <span class="input-group-btn">
                                <button class="btn btn-primary copy-btn" data-clipboard-text="![${escapeHtml(data.srcName || '')}](${escapeHtml(data.url)})">复制</button>
                            </span>
                        </div>
                        <div class="input-group" style="margin-top: 5px;">
                            <span class="input-group-addon">HTML</span>
                            <input type="text" class="form-control url-input" value='<img src="${escapeHtml(data.url)}" />' readonly>
                            <span class="input-group-btn">
                                <button class="btn btn-primary copy-btn" data-clipboard-text='<img src="${escapeHtml(data.url)}" />'>复制</button>
                            </span>
                        </div>
                        ${data.del ? `<a href="${escapeHtml(data.del)}" class="btn btn-danger btn-sm" style="margin-top: 5px;"><i class="icon icon-trash"></i> 删除</a>` : ''}
                    </div>
                </div>
            `;
            resultList.appendChild(div);
            new Clipboard('.copy-btn').on('success', function() {
                new $.zui.Messager('复制成功', { type: 'success', icon: 'ok-sign' }).show();
            });
        }
    </script>
</body>
</html>
