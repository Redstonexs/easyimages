<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.config.Title}}</title>
    <meta name="keywords" content="{{.config.Keywords}}">
    <meta name="description" content="{{.config.Description}}">
    <link rel="stylesheet" href="/public/static/zui/css/zui.min.css">
    <link rel="stylesheet" href="/public/static/EasyImage.css">
    <style>
        body { background: #f5f5f5; }
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fff;
        }
        .upload-area:hover { border-color: #3280fc; background: #f0f7ff; }
        .upload-area.dragover { border-color: #3280fc; background: #e6f0ff; }
        .upload-btn { margin: 20px 0; }
        .result-area { margin-top: 20px; }
        .link-box { margin: 10px 0; padding: 10px; background: #f9f9f9; border-radius: 5px; }
        .preview-img { max-width: 200px; max-height: 200px; margin: 10px; }
        .fab-buttons { position: fixed; bottom: 20px; right: 20px; z-index: 100; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 800px; margin-top: 50px;">
        <div class="text-center">
            <h1>{{.config.Title}}</h1>
            <p class="text-muted">{{.config.Description}}</p>
        </div>

        <div class="upload-area" id="uploadArea">
            <i class="icon icon-cloud-upload icon-3x"></i>
            <h3>拖拽文件到此处或点击选择</h3>
            <p class="text-muted">支持 jpg, png, gif, webp 等格式</p>
            <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
            <button class="btn btn-primary btn-lg upload-btn" onclick="document.getElementById('fileInput').click()">
                <i class="icon icon-upload"></i> 选择文件
            </button>
        </div>

        <div class="result-area" id="resultArea" style="display: none;">
            <h3>上传结果</h3>
            <div id="resultList"></div>
        </div>

        <div class="text-center" style="margin-top: 30px;">
            <a href="/app/list" class="btn btn-default">
                <i class="icon icon-list"></i> 查看图床广场
            </a>
            {{if .config.APIStatus}}
            <a href="/api/" class="btn btn-default">
                <i class="icon icon-code"></i> API接口
            </a>
            {{end}}
        </div>

        <div class="text-center text-muted" style="margin-top: 50px;">
            <p>Powered by <a href="https://github.com/icret/EasyImages2.0">EasyImage</a> v{{.version}}</p>
        </div>
    </div>

    <!-- 登录模态框 -->
    <div class="modal fade" id="loginModal">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">关闭</span></button>
                    <h4 class="modal-title"><i class="icon icon-sign-in"></i> 管理员登录</h4>
                </div>
                <div class="modal-body">
                    <div id="loginError" class="alert alert-danger" style="display: none;"></div>
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="loginUser" class="form-control" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="loginPass" class="form-control" placeholder="请输入密码" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="loginBtn">
                        <i class="icon icon-ok"></i> 登录
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 悬浮按钮 -->
    <div class="fab-buttons">
        <div class="btn-group-vertical">
            <a href="/app/list" class="btn btn-default" title="图床广场">
                <i class="icon icon-list"></i>
            </a>
            <button class="btn btn-primary" id="adminBtn" title="管理员登录">
                <i class="icon icon-user"></i>
            </button>
        </div>
    </div>

    <script src="/public/static/zui/lib/jquery/jquery-3.6.4.min.js"></script>
    <script src="/public/static/zui/js/zui.min.js"></script>
    <script src="/public/static/zui/lib/clipboard/clipboard.min.js"></script>
    <script>
        // 登录功能
        $(document).ready(function() {
            // 显示登录模态框
            $('#adminBtn').click(function() {
                {{if .isAdmin}}
                    // 已登录，跳转到管理后台
                    window.location.href = '/admin/manager';
                {{else}}
                    // 显示登录模态框
                    $('#loginModal').modal('show');
                {{end}}
            });

            // 登录按钮点击事件
            $('#loginBtn').click(function() {
                var user = $('#loginUser').val();
                var pass = $('#loginPass').val();

                if (!user || !pass) {
                    $('#loginError').text('请输入用户名和密码').show();
                    return;
                }

                // 发送登录请求
                $.ajax({
                    url: '/api/login',
                    type: 'POST',
                    data: {
                        user: user,
                        password: pass
                    },
                    success: function(data) {
                        if (data.result === 'success') {
                            // 登录成功，跳转到管理后台
                            window.location.href = '/admin/manager';
                        } else {
                            $('#loginError').text(data.message || '登录失败').show();
                        }
                    },
                    error: function() {
                        $('#loginError').text('登录请求失败').show();
                    }
                });
            });

            // 回车键提交
            $('#loginPass').keypress(function(e) {
                if (e.which === 13) {
                    $('#loginBtn').click();
                }
            });
        });

        // 上传功能
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const resultArea = document.getElementById('resultArea');
        const resultList = document.getElementById('resultList');

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            if (files.length === 0) return;

            const formData = new FormData();
            for (let i = 0; i < files.length; i++) {
                formData.append('file', files[i]);
            }

            // 显示上传中
            new $.zui.Messager('上传中...', {
                type: 'info',
                icon: 'upload'
            }).show();

            fetch('/app/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.result === 'success') {
                    resultArea.style.display = 'block';
                    if (data.files) {
                        data.files.forEach(file => addResult(file));
                    } else {
                        addResult(data);
                    }
                    new $.zui.Messager('上传成功', {
                        type: 'success',
                        icon: 'ok-sign'
                    }).show();
                } else {
                    new $.zui.Messager(data.message || '上传失败', {
                        type: 'danger',
                        icon: 'exclamation-sign'
                    }).show();
                }
            })
            .catch(error => {
                new $.zui.Messager('上传失败: ' + error.message, {
                    type: 'danger',
                    icon: 'exclamation-sign'
                }).show();
            });
        }

        function addResult(data) {
            const div = document.createElement('div');
            div.className = 'link-box';
            div.innerHTML = `
                <div class="row">
                    <div class="col-md-3">
                        <img src="${data.thumb || data.url}" class="preview-img" alt="preview">
                    </div>
                    <div class="col-md-9">
                        <div class="input-group">
                            <span class="input-group-addon">直链</span>
                            <input type="text" class="form-control url-input" value="${data.url}" readonly>
                            <span class="input-group-btn">
                                <button class="btn btn-primary copy-btn" data-clipboard-text="${data.url}">复制</button>
                            </span>
                        </div>
                        <div class="input-group" style="margin-top: 5px;">
                            <span class="input-group-addon">Markdown</span>
                            <input type="text" class="form-control url-input" value="![${data.srcName}](${data.url})" readonly>
                            <span class="input-group-btn">
                                <button class="btn btn-primary copy-btn" data-clipboard-text="![${data.srcName}](${data.url})">复制</button>
                            </span>
                        </div>
                        <div class="input-group" style="margin-top: 5px;">
                            <span class="input-group-addon">HTML</span>
                            <input type="text" class="form-control url-input" value='<img src="${data.url}" />' readonly>
                            <span class="input-group-btn">
                                <button class="btn btn-primary copy-btn" data-clipboard-text='<img src="${data.url}" />'>复制</button>
                            </span>
                        </div>
                        ${data.del ? `<a href="${data.del}" class="btn btn-danger btn-sm" style="margin-top: 5px;"><i class="icon icon-trash"></i> 删除</a>` : ''}
                    </div>
                </div>
            `;
            resultList.appendChild(div);

            // 初始化复制按钮
            new Clipboard('.copy-btn').on('success', function(e) {
                new $.zui.Messager('复制成功', {
                    type: 'success',
                    icon: 'ok-sign'
                }).show();
            });
        }
    </script>
</body>
</html>
