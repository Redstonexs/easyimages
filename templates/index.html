<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.config.Title}}</title>
    <meta name="keywords" content="{{.config.Keywords}}">
    <meta name="description" content="{{.config.Description}}">
    <link rel="icon" href="{{.config.SiteIcon}}">
    <link rel="stylesheet" href="/public/static/zui/css/zui.min.css">
    <link rel="stylesheet" href="/public/static/EasyImage.css">
    {{if and .captcha (ne .captcha.Type "disabled")}}
    {{if eq .captcha.Type "turnstile"}}
    <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin>
    <link rel="preload" href="https://challenges.cloudflare.com/turnstile/v0/api.js" as="script" crossorigin>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    {{else if eq .captcha.Type "recaptcha"}}
    <link rel="preconnect" href="https://www.google.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preload" href="https://www.google.com/recaptcha/api.js" as="script" crossorigin>
    <script src="https://www.google.com/recaptcha/api.js?render={{.captcha.SiteKey}}" async defer></script>
    {{end}}
    {{end}}
    {{vite "web/src/entries/upload.ts"}}
</head>
<body>
    <div id="upload-app"></div>
    <script>
        window.EasyImageUpload = {{json_script .frontend}};
    </script>
</body>
</html>
