<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.config.Title}}</title>
    <meta name="keywords" content="{{.config.Keywords}}">
    <meta name="description" content="{{.config.Description}}">
    <link rel="icon" href="{{.config.SiteIcon}}">
    <meta name="color-scheme" content="light dark">
    <script>(function(){try{var t=localStorage.getItem('easyimage-theme');var d=t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches);var r=document.documentElement;if(d){r.classList.add('dark');r.style.colorScheme='dark'}else{r.style.colorScheme='light'}}catch(e){}})();</script>
    <style>html{background:#ffffff;color:#0a0a0a;color-scheme:light;scrollbar-gutter:stable}html.dark{background:#0a0a0a;color:#f7f7f5;color-scheme:dark}body{margin:0;min-height:100vh;background:inherit;color:inherit}</style>
    {{if and .captcha (ne .captcha.Type "disabled")}}
    {{if eq .captcha.Type "turnstile"}}
    <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin>
    <link rel="preload" href="https://challenges.cloudflare.com/turnstile/v0/api.js" as="script" crossorigin>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    {{else if eq .captcha.Type "recaptcha"}}
    <link rel="preconnect" href="https://www.google.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preload" href="https://www.google.com/recaptcha/api.js" as="script" crossorigin>
    <script src="https://www.google.com/recaptcha/api.js?render={{.captcha.SiteKey}}" async defer></script>
    {{else if eq .captcha.Type "cap"}}
    {{if .captcha.WasmURL}}<script>window.CAP_CUSTOM_WASM_URL = "{{.captcha.WasmURL}}";</script>{{end}}
    <script src="{{.captcha.WidgetURL}}" defer></script>
    {{end}}
    {{end}}
    {{vite "web/src/entries/upload.ts"}}
</head>
<body>
    <div id="upload-app"></div>
    <script>
        window.EasyImageUpload = {{json_script .frontend}};
    </script>
</body>
</html>
