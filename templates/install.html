<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安装 - EasyImage</title>
    <link rel="icon" href="{{.config.SiteIcon}}">
    <script>(function(){try{var t=localStorage.getItem('easyimage-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}})();</script>
    <style>
        :root { --bg:#ffffff; --fg:#0a0a0a; --card:#ffffff; --muted-fg:#6b6b6b; --border:#e5e5e5; }
        .dark { --bg:#0f0f0f; --fg:#fafafa; --card:#161616; --muted-fg:#a3a3a3; --border:rgba(255,255,255,0.12); }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            background: var(--bg);
            color: var(--fg);
            font-family: "Inter", "Noto Sans SC", "PingFang SC", system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            width: 100%;
            max-width: 440px;
            padding: 28px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card);
        }
        .brand { display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; margin-bottom:18px; }
        .brand-mark { display:grid; place-items:center; width:24px; height:24px; border-radius:6px; background:var(--fg); color:var(--bg); font-size:11px; font-weight:700; }
        h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
        .sub { margin: 6px 0 22px; font-size: 13px; color: var(--muted-fg); }
        .field { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; }
        input {
            width: 100%;
            height: 38px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--fg);
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: var(--fg); }
        .hint { margin: 6px 0 0; font-size: 12px; color: var(--muted-fg); }
        button {
            width: 100%;
            height: 40px;
            margin-top: 8px;
            border: 0;
            border-radius: 8px;
            background: var(--fg);
            color: var(--bg);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">EI</span>
            <span>EasyImage</span>
        </div>
        <h1>初始化安装</h1>
        <p class="sub">配置站点域名与管理员账号，完成后即可开始使用。</p>
        <form method="POST" action="/install/">
            <div class="field">
                <label for="install-domain">站点域名</label>
                <input id="install-domain" type="text" name="domain" required placeholder="https://img.example.com" value="{{.config.Domain}}">
                <p class="hint">请填写完整的站点访问地址，包含 http:// 或 https://</p>
            </div>
            <div class="field">
                <label for="install-user">管理员用户名</label>
                <input id="install-user" type="text" name="user" required placeholder="admin" value="{{.config.User}}">
            </div>
            <div class="field">
                <label for="install-pass">管理员密码</label>
                <input id="install-pass" type="password" name="password" required placeholder="请设置安全密码">
                <p class="hint">建议使用至少 8 位包含字母与数字的密码</p>
            </div>
            <button type="submit">完成安装</button>
        </form>
    </main>
</body>
</html>
