<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片信息 - {{.config.Title}}</title>
    <link rel="icon" href="{{.config.SiteIcon}}">
    <meta name="color-scheme" content="light dark">
    <script>(function(){try{var t=localStorage.getItem('easyimage-theme');var d=t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches);var r=document.documentElement;if(d){r.classList.add('dark');r.style.colorScheme='dark'}else{r.style.colorScheme='light'}}catch(e){}})();</script>
    <style>
        @view-transition { navigation: auto; }
        ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 200ms; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
        :root {
            --bg: #ffffff;
            --fg: #0a0a0a;
            --card: #ffffff;
            --muted: #f5f5f4;
            --muted-fg: #666664;
            --border: #e6e6e4;
        }
        html { background: var(--bg); color: var(--fg); color-scheme: light; }
        html.dark {
            --bg: #0a0a0a;
            --fg: #f7f7f5;
            --card: #121212;
            --muted: #1a1a1a;
            --muted-fg: #9a9a98;
            --border: rgba(255, 255, 255, 0.11);
            color-scheme: dark;
        }
        * { box-sizing: border-box; }
        @keyframes ei-enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--fg);
            font-family: "Inter", "Noto Sans SC", "PingFang SC", system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .card { animation: ei-enter 240ms cubic-bezier(0.22, 1, 0.36, 1) both; }
        @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
        .topbar {
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
        }
        .topbar-inner {
            max-width: 920px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--fg);
            text-decoration: none;
        }
        .brand-mark {
            display: grid;
            place-items: center;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: var(--fg);
            color: var(--bg);
            font-size: 11px;
            font-weight: 700;
        }
        .wrap { max-width: 920px; margin: 32px auto; padding: 0 16px; }
        .card {
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card);
            overflow: hidden;
        }
        .card-head {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
        }
        .card-head h1 { margin: 0; font-size: 18px; font-weight: 600; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 22px;
            align-items: start;
        }
        .preview {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 240px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--muted);
        }
        .preview img { max-width: 100%; max-height: 420px; border-radius: 6px; object-fit: contain; }
        .meta { display: grid; gap: 14px; }
        .meta-row { display: grid; gap: 4px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .meta-row:last-child { border-bottom: 0; padding-bottom: 0; }
        .meta-label { font-size: 12px; color: var(--muted-fg); }
        .meta-val { font-size: 14px; font-weight: 500; word-break: break-all; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
        .copy-row { display: flex; gap: 8px; margin-top: 4px; }
        .copy-row input {
            flex: 1;
            min-width: 0;
            height: 36px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--muted);
            color: var(--fg);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--fg);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
        .btn:hover { opacity: 0.88; }
        .copy-status { display: block; margin-top: 6px; font-size: 12px; color: var(--muted-fg); min-height: 16px; }
        .card-foot {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 16px 22px;
            border-top: 1px solid var(--border);
            background: var(--muted);
        }
        @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a href="/" class="brand">
                <span class="brand-mark" aria-hidden="true">EI</span>
                <span>{{.config.Title}}</span>
            </a>
        </div>
    </header>

    <main class="wrap">
        <section class="card">
            <header class="card-head">
                <h1>图片信息</h1>
            </header>
            <div class="grid">
                <div class="preview">
                    <img src="{{.info.url}}" alt="{{.info.displayName}}">
                </div>
                <div class="meta">
                    <div class="meta-row">
                        <span class="meta-label">文件名</span>
                        <span class="meta-val">{{.info.displayName}}</span>
                    </div>
                    {{if .info.originalName}}
                    <div class="meta-row">
                        <span class="meta-label">源文件名</span>
                        <span class="meta-val">{{.info.originalName}}</span>
                    </div>
                    <div class="meta-row">
                        <span class="meta-label">存储文件名</span>
                        <span class="meta-val mono">{{.info.storedName}}</span>
                    </div>
                    {{end}}
                    <div class="meta-row">
                        <span class="meta-label">文件大小</span>
                        <span class="meta-val mono">{{.info.size}}</span>
                    </div>
                    <div class="meta-row">
                        <span class="meta-label">上传时间</span>
                        <span class="meta-val mono">{{.info.modTime}}</span>
                    </div>
                    <div class="meta-row">
                        <label class="meta-label" for="image-link">图片链接</label>
                        <div class="copy-row">
                            <input id="image-link" type="text" value="{{.info.url}}" readonly>
                            <button id="copy-image-link" type="button" class="btn btn-primary">复制</button>
                        </div>
                        <span id="copy-status" class="copy-status" role="status"></span>
                    </div>
                </div>
            </div>
            <footer class="card-foot">
                <a href="/" class="btn btn-primary">继续上传</a>
                <a href="{{.info.url}}" target="_blank" rel="noopener noreferrer" class="btn">查看原图</a>
            </footer>
        </section>
    </main>

    <script>
        const imageLink = document.getElementById('image-link');
        const copyStatus = document.getElementById('copy-status');
        document.getElementById('copy-image-link').addEventListener('click', async () => {
            try {
                if (window.isSecureContext && navigator.clipboard) {
                    await navigator.clipboard.writeText(imageLink.value);
                    copyStatus.textContent = '已复制链接';
                    return;
                }
            } catch {
                // Fall back to selecting the input.
            }
            imageLink.select();
            copyStatus.textContent = document.execCommand('copy') ? '已复制链接' : '已选中链接，请手动复制';
        });
    </script>
</body>
</html>
