<!-- index.html -->

<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="renderer" content="webkit" />
    <meta name="force-rendering" content="webkit" />
    <meta name="author" content="EasyImage">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>EasyImage Go 简单图床</title>
    <link rel="shortcut icon" type="image/x-icon" href="../favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/themes/core.min.css" rel="stylesheet"
        integrity="sha384-EHVG4GyaSD3YEuLBkKV9+uYAxVxDbhmNuPVXRdvHjrC0+eLbs8F7fFiR2aeuXY5S" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/themes/addons/vue.min.css" rel="stylesheet"
        integrity="sha384-7UrCrrJrgccq8N0pbtJyi5KxBhdfCP2BMFFGJmHJqlnmKGdPL1W82xz4a2eegGRU" crossorigin="anonymous">
</head>

<body>
    <div id="app">EasyImage Go 简单图床文档...</div>

    <script>
        window.$docsify = {
            name: '简单图床 | 文档',
            // homepage: '../README.md',
            repo: 'Redstonexs/easyimages',//渲染github挂件 配置本地或线上地址
            loadSidebar: true,   //开启侧边栏 使用_sidebar.md 
            subMaxLevel: 1,      //侧边栏层级最大层级2
            loadNavbar: true,    //加载导航栏 需要编写_navbar.md
            autoHeader: true,    //配合loadSidebar 自动添加标题
            coverpage: true,

            alias: {
                '/.*/_sidebar.md': '/_sidebar.md'
            },
            copyCode: {
                buttonText: '复制',
                errorText: '错误',
                successText: '复制成功'
            },
            count: {
                countable: true,
                fontsize: '0.9em',
                color: 'rgb(90,90,90)',
                language: 'chinese'
            },
            search: { //默认的全局搜索 详细参数请看插件文档
                maxAge: 86400000, // 过期时间，单位毫秒，默认一天
                paths: 'auto',
                placeholder: '搜索文档',
            },
            plugins: [
                function (hook) {
                    var footer = [
                        '<hr/>',
                        '<footer>',
                        '<span>Copyright ©Since 2018 <a href="//github.com/Redstonexs/easyimages" target="_blank">EasyImage</a>, original project by <a href="//github.com/icret" target="_blank">Icret</a>, Docs By <a href="//docsify.js.org/#/zh-cn/" target="_blank">Docsify</a>.</span>',
                        '</footer>'
                    ].join('');

                    hook.afterEach(function (html) {
                        return html + footer;
                    });
                },

                function (hook, vm) {
                    hook.beforeEach(function (html) {
                        const link = document.createElement('a');
                        const file = String(vm.route.file).split('/').map(encodeURIComponent).join('/');
                        link.href = 'https://github.com/Redstonexs/easyimages/blob/master/docs/' + file;
                        link.target = '_blank';
                        link.rel = 'noopener';
                        link.textContent = '📝 在GitHub上编辑';
                        return html + '<br/><br/><br/><br/><br/>' + link.outerHTML;
                    });
                }
            ]
        }

        // 离线阅读
        if (typeof navigator.serviceWorker !== 'undefined') {
            navigator.serviceWorker.register('sw.js');
        }
    </script>

    <!-- docsify的js依赖 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/docsify.min.js"
        integrity="sha384-hx+mDRaRp2tw2tlDV9AVMMkU5zRLpaEIGGYt3k1ZiWSxGxIzCyP3FceVHUAMb1bI" crossorigin="anonymous"></script>
    <!-- 全文搜索插件 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/plugins/search.min.js"
        integrity="sha384-mkjQDRnwrfyRbChj7+qlTfCEvrsSsxs6VVslNDhuufsMKuF4STph3BezVwzTknga" crossorigin="anonymous"></script>
    <!-- 图片缩放插件 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/plugins/zoom-image.min.js"
        integrity="sha384-RNNKMNpcp4ZKtkrD4pFLYtVjNk15Q/sd4GpBAX4R87R6MnzKt4+T4InglTk+poHU" crossorigin="anonymous"></script>
    <!-- 代码拷贝插件 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.2"
        integrity="sha384-xvU4Qmx14Fe/3hDKuOUUQ8eOzoa7OVTL0vp3amTSv2KY8lCjlrga7DoqecFFOT7j" crossorigin="anonymous"></script>
    <!-- 代码高亮 -->
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js"
        integrity="sha384-9WmlN8ABpoFSSHvBGGjhvB3E/D8UkNB9HpLJjBQFC2VSQsM1odiQDv4NbEo+7l15" crossorigin="anonymous"></script>
    <!-- 字数统计 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify-count@1.1.0/dist/countable.js"
        integrity="sha384-icGJOehUE8xwuE6kTKHArUurn6/SUuMKJ+Rlp9zgBR8DkgYA+5o26akODP9umqqr" crossorigin="anonymous"></script>
    <!-- https://github.com/Sumsung524/docsify-backTop -->
    <script src="https://cdn.jsdelivr.net/gh/Sumsung524/docsify-backTop@82bf369db4817ef9aa1d98e99842b2c25bb06dd9/dist/docsify-backTop.min.js"
        integrity="sha384-n3TxCXMOd+o8ziETgu2X4da0oB1tCEPnJHtep6vhycN10OXvuW8yKdH0Yiadupr5" crossorigin="anonymous"></script>
</body>

</html>
